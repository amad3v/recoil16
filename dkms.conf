PACKAGE_NAME="recoil16"
PACKAGE_VERSION="1.0.0"
AUTOINSTALL="yes"

BUILT_MODULE_NAME[0]="ite8291-mono"
BUILT_MODULE_LOCATION[0]="ite8291-mono/"
DEST_MODULE_LOCATION[0]="/kernel/drivers/hid"

BUILT_MODULE_NAME[1]="ite8233-lightbar"
BUILT_MODULE_LOCATION[1]="ite8233-lightbar/"
DEST_MODULE_LOCATION[1]="/kernel/drivers/hid"

BUILT_MODULE_NAME[2]="copilot-rctrl"
BUILT_MODULE_LOCATION[2]="copilot-rctrl/"
DEST_MODULE_LOCATION[2]="/kernel/drivers/input/keyboard"

BUILT_MODULE_NAME[3]="uniwill-laptop"
BUILT_MODULE_LOCATION[3]="uniwill-laptop-pcs/"
DEST_MODULE_LOCATION[3]="/kernel/drivers/platform/x86/uniwill"
# 7.2 APIs; the Kbuild skips this module on older kernels
BUILD_EXCLUSIVE_KERNEL_MIN[3]="7.2"
